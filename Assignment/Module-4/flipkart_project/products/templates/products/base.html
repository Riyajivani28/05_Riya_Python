<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Flipkart Products</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body {
            background-color: #f1f3f6;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background-color: #2874f0;
        }

        .navbar-brand {
            color: white !important;
            font-size: 24px;
            font-weight: bold;
        }

        .main-container {
            margin-top: 40px;
            margin-bottom: 40px;
        }

        .card {
            border: none;
            border-radius: 10px;
            box-shadow: 0px 3px 12px rgba(0,0,0,0.10);
        }

        .btn-primary {
            background-color: #2874f0;
            border-color: #2874f0;
        }

        .table {
            background-color: white;
        }

        .table th {
            background-color: #2874f0;
            color: white;
        }

        .footer {
            background-color: #172337;
            color: white;
            padding: 20px;
            text-align: center;
            margin-top: 50px;
        }

    </style>

</head>


<body>

    <!-- Navbar -->

    <nav class="navbar navbar-expand-lg">

        <div class="container">

            <a class="navbar-brand" href="{% url 'product_list' %}">
                Flipkart
            </a>

        </div>

    </nav>


    <!-- Main Content -->

    <div class="container main-container">

        {% block content %}

        {% endblock %}

    </div>


    <div class="footer">

        <p class="mb-0">
            Flipkart Product Management System
        </p>

    </div>

</body>

</html>
