{% extends 'products/base.html' %}


{% block content %}

<div class="row justify-content-center">

    <div class="col-md-7">

        <div class="card p-4">

            <h2 class="text-center fw-bold mb-4">

                Add New Product

            </h2>


            <form method="POST">

                {% csrf_token %}


                <div class="mb-3">

                    <label class="form-label">
                        Product Name
                    </label>

                    {{ form.name }}

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Price
                    </label>

                    {{ form.price }}

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Category
                    </label>

                    {{ form.category }}

                </div>


                <div class="d-flex gap-2">

                    <button type="submit"
                            class="btn btn-primary">

                        Add Product

                    </button>


                    <a href="{% url 'product_list' %}"
                       class="btn btn-secondary">

                        Cancel

                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
