{% extends 'base.html' %}

{% block title %}➕ Add Movie{% endblock %}

{% block content %}
<div class="form-card">
    <h2 style="color: var(--brown-dark); margin-bottom: 1.5rem;">🎬 ➕ Add New Movie</h2>

    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label class="form-label">Movie Name</label>
            <input type="text" name="name" class="form-control" required placeholder="e.g. Oppenheimer, Avatar 2">
        </div>

        <div class="btn-group" style="margin-top: 1.5rem;">
            <button type="submit" class="btn btn-primary">Save Movie</button>
            <a href="{% url 'movies' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
