{% extends 'base.html' %}

{% block title %}✍️ Add Movie Review{% endblock %}

{% block content %}
<div class="form-card">
    <h2 style="color: var(--brown-dark); margin-bottom: 1.5rem;">✍️ Add Review for Movie</h2>

    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label class="form-label">Select Movie</label>
            <select name="movie_id" class="form-control" required>
                <option value="">-- Choose a Movie --</option>
                {% for movie in movies %}
                    <option value="{{ movie.id }}">{{ movie.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label class="form-label">Review Text</label>
            <textarea name="review_text" rows="4" class="form-control" required placeholder="Write movie review feedback here..."></textarea>
        </div>

        <div class="form-group">
            <label class="form-label">Rating (1 to 5)</label>
            <select name="rating" class="form-control" required>
                <option value="5">5 Stars ★★★★★</option>
                <option value="4">4 Stars ★★★★☆</option>
                <option value="3">3 Stars ★★★☆☆</option>
                <option value="2">2 Stars ★★☆☆☆</option>
                <option value="1">1 Star ★☆☆☆☆</option>
            </select>
        </div>

        <div class="btn-group" style="margin-top: 1.5rem;">
            <button type="submit" class="btn btn-primary">Submit Review</button>
            <a href="{% url 'movies' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
