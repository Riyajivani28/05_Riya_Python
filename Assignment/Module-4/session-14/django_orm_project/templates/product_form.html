{% extends 'base.html' %}

{% block title %}➕ Add Product{% endblock %}

{% block content %}
<div class="form-card">
    <h2 style="color: var(--brown-dark); margin-bottom: 1.5rem;">🛍️ ➕ Add New Product</h2>

    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label class="form-label">Product Name</label>
            <input type="text" name="name" class="form-control" required placeholder="e.g. Wireless Mouse, Running Shoes">
        </div>

        <div class="form-group">
            <label class="form-label">Category</label>
            <select name="category_id" class="form-control" required>
                <option value="">-- Choose Category --</option>
                {% for cat in categories %}
                    <option value="{{ cat.id }}">{{ cat.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label class="form-label">Price (₹)</label>
            <input type="number" step="0.01" min="0" name="price" class="form-control" required placeholder="e.g. 799.00">
        </div>

        <div class="form-group">
            <label class="form-label">Rating (0.0 - 5.0)</label>
            <input type="number" step="0.1" min="0" max="5" name="rating" value="4.5" class="form-control" required>
        </div>

        <div class="btn-group" style="margin-top: 1.5rem;">
            <button type="submit" class="btn btn-primary">Save Product</button>
            <a href="{% url 'products' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
