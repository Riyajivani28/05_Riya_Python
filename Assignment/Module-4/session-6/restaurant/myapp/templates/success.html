<!DOCTYPE html>
<html>
<head>
    <title>Restaurant Details</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-orange-50 flex items-center justify-center min-h-screen">

<div class="bg-white shadow-xl rounded-2xl p-10 w-[500px]">

    <h1 class="text-3xl font-bold text-orange-500 mb-6 text-center">
        🎉 Restaurant Added Successfully
    </h1>

    <div class="space-y-4">

        <p>
            <strong>Restaurant Name :</strong>
            {{ restaurant_name }}
        </p>

        <p>
            <strong>Cuisine Type :</strong>
            {{ cuisine_type }}
        </p>

        <p>
            <strong>Contact Email :</strong>
            {{ contact_email }}
        </p>

    </div>

    <a href="/"
       class="block mt-8 bg-orange-500 text-white text-center py-3 rounded-lg hover:bg-orange-600">
        Add Another Restaurant
    </a>

</div>

</body>
</html>
