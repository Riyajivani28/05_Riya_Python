{% extends 'base.html' %}

{% block title %}Send Test Email{% endblock %}

{% block content %}
<div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 md:p-8">
    <div class="mb-6 flex items-center space-x-3">
        <div class="w-10 h-10 rounded-lg bg-indigo-50 text-indigo-600 flex items-center justify-center text-lg">
            <i class="fa-solid fa-paper-plane"></i>
        </div>
        <div>
            <h1 class="text-2xl font-bold text-gray-900">Simple Test Email Form</h1>
            <p class="text-sm text-gray-500">Send a simple plain text email using Django's <code class="bg-gray-100 px-1 py-0.5 rounded text-indigo-600">send_mail</code> function.</p>
        </div>
    </div>

    <form method="POST" action="{% url 'send_simple_test_email' %}" class="space-y-5">
        {% csrf_token %}

        <div>
            <label for="recipient_email" class="block text-sm font-semibold text-gray-700 mb-1">Recipient Email Address</label>
            <input type="email" id="recipient_email" name="recipient_email" value="{{ default_email }}" required
                   class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition">
        </div>

        <div>
            <label for="subject" class="block text-sm font-semibold text-gray-700 mb-1">Email Subject</label>
            <input type="text" id="subject" name="subject" value="Django Test Email" required
                   class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition">
        </div>

        <div>
            <label for="message" class="block text-sm font-semibold text-gray-700 mb-1">Message Body</label>
            <textarea id="message" name="message" rows="4" required
                      class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition">Hello! This is a simple test email sent using Django send_mail function.</textarea>
        </div>

        <div class="pt-2 flex items-center justify-between">
            <a href="{% url 'email_index' %}" class="text-sm font-medium text-gray-600 hover:text-gray-900">← Back to Dashboard</a>
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-6 py-2.5 rounded-lg shadow-sm transition flex items-center space-x-2">
                <i class="fa-solid fa-paper-plane text-sm"></i>
                <span>Send Test Email</span>
            </button>
        </div>
    </form>
</div>
{% endblock %}
