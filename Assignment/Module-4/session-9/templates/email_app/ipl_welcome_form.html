{% extends 'base.html' %}

{% block title %}IPL Fantasy Welcome Email{% endblock %}

{% block content %}
<div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 md:p-8">
    <div class="mb-6 flex items-center space-x-3">
        <div class="w-10 h-10 rounded-lg bg-red-50 text-red-600 flex items-center justify-center text-lg">
            <i class="fa-solid fa-trophy"></i>
        </div>
        <div>
            <h1 class="text-2xl font-bold text-gray-900">IPL Fantasy Welcome Email Form</h1>
            <p class="text-sm text-gray-500">Sends AI-generated catchy subject line & HTML email template using <code class="bg-gray-100 px-1 py-0.5 rounded text-red-600">EmailMultiAlternatives</code>.</p>
        </div>
    </div>

    <form method="POST" action="{% url 'send_ipl_welcome_email_default' %}" class="space-y-5">
        {% csrf_token %}

        <div class="grid md:grid-cols-2 gap-4">
            <div>
                <label for="user_email" class="block text-sm font-semibold text-gray-700 mb-1">User Email Address</label>
                <input type="email" id="user_email" name="user_email" value="{{ default_email }}" required
                       class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none transition">
            </div>

            <div>
                <label for="user_name" class="block text-sm font-semibold text-gray-700 mb-1">Player Name</label>
                <input type="text" id="user_name" name="user_name" value="Riya" required
                       class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none transition">
            </div>
        </div>

        <div>
            <label for="subject" class="block text-sm font-semibold text-gray-700 mb-1">Catchy AI Subject Line</label>
            <input type="text" id="subject" name="subject" value="🏏 Game On! Welcome to IPL Fantasy League 2026 - Build Your Dream XI Now! 🏆" required
                   class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none transition">
        </div>

        <div class="pt-2 flex items-center justify-between">
            <a href="{% url 'email_index' %}" class="text-sm font-medium text-gray-600 hover:text-gray-900">← Back to Dashboard</a>
            <button type="submit" class="bg-red-600 hover:bg-red-700 text-white font-medium px-6 py-2.5 rounded-lg shadow-sm transition flex items-center space-x-2">
                <i class="fa-solid fa-fire text-sm"></i>
                <span>Send IPL Welcome Email</span>
            </button>
        </div>
    </form>
</div>
{% endblock %}
