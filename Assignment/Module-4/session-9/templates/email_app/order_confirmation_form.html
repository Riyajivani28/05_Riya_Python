{% extends 'base.html' %}

{% block title %}Swiggy Order Confirmation Email{% endblock %}

{% block content %}
<div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 md:p-8">
    <div class="mb-6 flex items-center space-x-3">
        <div class="w-10 h-10 rounded-lg bg-orange-50 text-orange-600 flex items-center justify-center text-lg">
            <i class="fa-solid fa-utensils"></i>
        </div>
        <div>
            <h1 class="text-2xl font-bold text-gray-900">Swiggy Order Confirmation Form</h1>
            <p class="text-sm text-gray-500">Sends a dynamic HTML email using <code class="bg-gray-100 px-1 py-0.5 rounded text-orange-600">EmailMultiAlternatives</code> & <code class="bg-gray-100 px-1 py-0.5 rounded text-orange-600">render_to_string</code>.</p>
        </div>
    </div>

    <form method="POST" action="{% url 'send_order_confirmation_email_default' %}" class="space-y-5">
        {% csrf_token %}

        <div class="grid md:grid-cols-2 gap-4">
            <div>
                <label for="user_email" class="block text-sm font-semibold text-gray-700 mb-1">Customer Email</label>
                <input type="email" id="user_email" name="user_email" value="{{ default_email }}" required
                       class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none transition">
            </div>

            <div>
                <label for="user_name" class="block text-sm font-semibold text-gray-700 mb-1">Customer Name</label>
                <input type="text" id="user_name" name="user_name" value="Riya" required
                       class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none transition">
            </div>
        </div>

        <div class="grid md:grid-cols-2 gap-4">
            <div>
                <label for="order_id" class="block text-sm font-semibold text-gray-700 mb-1">Order ID</label>
                <input type="text" id="order_id" name="order_id" value="SWG987654" required
                       class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none transition">
            </div>

            <div>
                <label for="restaurant_name" class="block text-sm font-semibold text-gray-700 mb-1">Restaurant Name</label>
                <input type="text" id="restaurant_name" name="restaurant_name" value="Biryani Blues" required
                       class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none transition">
            </div>
        </div>

        <div>
            <label for="delivery_address" class="block text-sm font-semibold text-gray-700 mb-1">Delivery Address</label>
            <input type="text" id="delivery_address" name="delivery_address" value="101 Horizon Towers, SG Highway, Ahmedabad" required
                   class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none transition">
        </div>

        <div>
            <label for="total_amount" class="block text-sm font-semibold text-gray-700 mb-1">Total Amount (₹)</label>
            <input type="number" id="total_amount" name="total_amount" value="650" required
                   class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none transition">
        </div>

        <div class="pt-2 flex items-center justify-between">
            <a href="{% url 'email_index' %}" class="text-sm font-medium text-gray-600 hover:text-gray-900">← Back to Dashboard</a>
            <button type="submit" class="bg-orange-500 hover:bg-orange-600 text-white font-medium px-6 py-2.5 rounded-lg shadow-sm transition flex items-center space-x-2">
                <i class="fa-solid fa-burger text-sm"></i>
                <span>Send Swiggy Order Confirmation Email</span>
            </button>
        </div>
    </form>
</div>
{% endblock %}
