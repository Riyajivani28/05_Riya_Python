{% extends 'base.html' %}

{% block title %}Password Reset Email{% endblock %}

{% block content %}
<div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 md:p-8">
    <div class="mb-6 flex items-center space-x-3">
        <div class="w-10 h-10 rounded-lg bg-amber-50 text-amber-600 flex items-center justify-center text-lg">
            <i class="fa-solid fa-key"></i>
        </div>
        <div>
            <h1 class="text-2xl font-bold text-gray-900">Password Reset Email Form</h1>
            <p class="text-sm text-gray-500">Sends a Paytm/Flipkart style password reset email using <code class="bg-gray-100 px-1 py-0.5 rounded text-amber-600">send_mail</code>.</p>
        </div>
    </div>

    <form method="POST" action="{% url 'send_password_reset_email_default' %}" class="space-y-5">
        {% csrf_token %}

        <div>
            <label for="user_email" class="block text-sm font-semibold text-gray-700 mb-1">User Email Address</label>
            <input type="email" id="user_email" name="user_email" value="{{ default_email }}" required
                   class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none transition">
        </div>

        <div>
            <label for="app_name" class="block text-sm font-semibold text-gray-700 mb-1">App Brand Name</label>
            <input type="text" id="app_name" name="app_name" value="Paytm" required
                   class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none transition">
        </div>

        <div class="pt-2 flex items-center justify-between">
            <a href="{% url 'email_index' %}" class="text-sm font-medium text-gray-600 hover:text-gray-900">← Back to Dashboard</a>
            <button type="submit" class="bg-amber-600 hover:bg-amber-700 text-white font-medium px-6 py-2.5 rounded-lg shadow-sm transition flex items-center space-x-2">
                <i class="fa-solid fa-lock text-sm"></i>
                <span>Send Password Reset Email</span>
            </button>
        </div>
    </form>
</div>
{% endblock %}
