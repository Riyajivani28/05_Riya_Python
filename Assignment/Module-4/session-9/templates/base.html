<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Django Email Suite{% endblock %}</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">

    <!-- Header / Navbar -->
    <nav class="bg-indigo-600 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center space-x-3">
                    <i class="fa-solid fa-paper-plane text-2xl text-yellow-300"></i>
                    <a href="{% url 'email_index' %}" class="font-bold text-xl tracking-wide">Django Email Studio</a>
                </div>
                <div class="hidden md:flex space-x-4">
                    <a href="{% url 'email_index' %}" class="hover:bg-indigo-700 px-3 py-2 rounded-md text-sm font-medium">Dashboard</a>
                    <a href="{% url 'send_simple_test_email' %}" class="hover:bg-indigo-700 px-3 py-2 rounded-md text-sm font-medium">Test Email</a>
                    <a href="{% url 'send_password_reset_email_default' %}" class="hover:bg-indigo-700 px-3 py-2 rounded-md text-sm font-medium">Password Reset</a>
                    <a href="{% url 'send_order_confirmation_email_default' %}" class="hover:bg-indigo-700 px-3 py-2 rounded-md text-sm font-medium">Order Confirmation</a>
                    <a href="{% url 'send_ipl_welcome_email_default' %}" class="hover:bg-indigo-700 px-3 py-2 rounded-md text-sm font-medium">IPL Welcome</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Container -->
    <main class="flex-grow max-w-4xl w-full mx-auto px-4 py-8">
        <!-- Messages Banner -->
        {% if messages %}
            <div class="mb-6">
                {% for message in messages %}
                    <div class="p-4 rounded-lg shadow-sm border flex items-center justify-between {% if message.tags == 'success' %}bg-green-50 border-green-200 text-green-800{% else %}bg-blue-50 border-blue-200 text-blue-800{% endif %}">
                        <div class="flex items-center space-x-3">
                            <i class="fa-solid {% if message.tags == 'success' %}fa-circle-check text-green-600{% else %}fa-circle-info text-blue-600{% endif %} text-xl"></i>
                            <span class="font-medium">{{ message }}</span>
                        </div>
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-gray-400 py-4 text-center text-sm border-t border-gray-700 mt-auto">
        <p>© 2026 Django Email Studio Assignment | Built with Django & Tailwind CSS</p>
    </footer>

</body>
</html>
