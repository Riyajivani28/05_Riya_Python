<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Django Test Email</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 20px;
            color: #1f2937;
        }
        .email-card {
            max-width: 580px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border: 1px solid #e5e7eb;
        }
        .header {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: #ffffff;
            padding: 28px 24px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 700;
        }
        .body {
            padding: 28px 24px;
            line-height: 1.6;
        }
        .badge {
            display: inline-block;
            background-color: #e0e7ff;
            color: #4338ca;
            font-weight: 600;
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 9999px;
            margin-bottom: 16px;
            text-transform: uppercase;
        }
        .message-box {
            background-color: #f9fafb;
            border: 1px solid #f3f4f6;
            border-left: 4px solid #4f46e5;
            padding: 16px;
            border-radius: 6px;
            margin: 20px 0;
            font-size: 15px;
        }
        .footer {
            background-color: #f9fafb;
            text-align: center;
            padding: 16px;
            font-size: 12px;
            color: #6b7280;
            border-top: 1px solid #f3f4f6;
        }
    </style>
</head>
<body>
    <div class="email-card">
        <div class="header">
            <h1>🚀 Django Test Notification</h1>
        </div>
        <div class="body">
            <span class="badge">System Test</span>
            <h2>Hello! 👋</h2>
            <p>This is a styled HTML test email sent using Django's email service.</p>
            
            <div class="message-box">
                <strong>Subject:</strong> {{ subject }}<br>
                <strong>Message:</strong> {{ message }}
            </div>

            <p>If you received this email, your Django Gmail SMTP setup is working perfectly!</p>
        </div>
        <div class="footer">
            <p>Sent from Django Email Studio © 2026</p>
        </div>
    </div>
</body>
</html>
