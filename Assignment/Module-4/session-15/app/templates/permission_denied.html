{% extends 'base.html' %}

{% block title %}403 - Permission Denied{% endblock %}

{% block content %}
<div class="row justify-content-center my-5 py-4">
    <div class="col-md-8 col-lg-6 text-center">
        <div class="card border-0 shadow-sm p-5">
            <div class="text-danger mb-3">
                <i class="bi bi-shield-lock-fill display-1"></i>
            </div>
            <span class="badge bg-danger-subtle text-danger px-3 py-1 rounded-pill mb-3 fw-bold align-self-center fs-6">
                403 Access Forbidden
            </span>
            <h3 class="fw-bold text-dark mb-2">Permission Denied</h3>
            <p class="text-muted fs-5 mb-4">
                Sorry, you don't have permission to access this page.
            </p>
            <div class="d-flex justify-content-center gap-3">
                <a href="{% url 'dashboard' %}" class="btn btn-primary px-4 py-2 fw-semibold">
                    <i class="bi bi-speedometer2 me-2"></i>Back to Dashboard
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
