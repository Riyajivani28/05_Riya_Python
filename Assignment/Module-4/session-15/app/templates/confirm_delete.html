{% extends 'base.html' %}

{% block title %}Confirm Delete{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-sm p-4 text-center">
            <div class="text-danger mb-3">
                <i class="bi bi-exclamation-triangle-fill display-3"></i>
            </div>
            <h4 class="fw-bold mb-2">Delete {{ type }}?</h4>
            <p class="text-muted mb-4">Are you sure you want to permanently delete "<strong>{{ object }}</strong>"? This action cannot be undone.</p>
            <form method="post">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-3">
                    <a href="{% url cancel_url %}" class="btn btn-light border px-4">Cancel</a>
                    <button type="submit" class="btn btn-danger px-4 fw-semibold">Yes, Delete</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
