<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Profile</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(
                135deg,
                #e0f2fe,
                #f8fafc
            );

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 18px;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.12);
        }

        h1 {
            text-align: center;
            color: #1e3a8a;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
            font-size: 14px;
        }

        form p {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #334155;
            font-weight: bold;
            font-size: 14px;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 12px 14px;

            border: 1px solid #cbd5e1;
            border-radius: 8px;

            outline: none;
            font-size: 15px;
        }

        input[type="text"]:focus,
        input[type="number"]:focus {
            border-color: #2563eb;

            box-shadow:
                0 0 0 3px
                rgba(37, 99, 235, 0.1);
        }

        input[type="checkbox"] {
            width: 17px;
            height: 17px;
            margin-right: 8px;
        }

        .btn {
            width: 100%;
            border: none;

            padding: 13px;

            border-radius: 8px;

            background: #2563eb;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        .btn:hover {
            background: #1d4ed8;
        }

        .back-link {
            display: block;
            text-align: center;

            margin-top: 20px;

            color: #2563eb;
            text-decoration: none;

            font-weight: bold;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="card">

            <h1>Edit Profile</h1>

            <p class="subtitle">
                Update {{ profile.username }}'s profile
            </p>

            <form method="POST">

                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit" class="btn">
                    Update Profile
                </button>

            </form>

            <a
                href="{% url 'profile_list' %}"
                class="back-link"
            >
                ← Back to Profiles
            </a>

        </div>

    </div>

</body>

</html>
